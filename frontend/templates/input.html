<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Review Detective - Input</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <style>
        body { background: #f5f5f5; font-family: 'Arial', sans-serif; padding: 2rem; }
        .container { max-width: 800px; margin: 0 auto; background: white; padding: 2rem; border-radius: 10px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        h1 { text-align: center; margin-bottom: 1.5rem; }
        .input-section { margin-bottom: 2rem; }
        textarea { width: 100%; height: 150px; padding: 0.8rem; border: 1px solid #ddd; border-radius: 4px; resize: vertical; }
        button { width: 100%; padding: 0.8rem; background: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; }
        button:hover { background: #0056b3; }
        .logout-button { text-align: center; margin-top: 2rem; }
        .result-section { margin-top: 1.5rem; padding: 1rem; border-radius: 5px; display: none; text-align: center; }
        .fake { background: #f8d7da; color: #721c24; }
        .genuine { background: #d4edda; color: #155724; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Review Analysis</h1>
        <div class="input-section">
            <h2>Text Input</h2>
            <textarea id="reviewText" placeholder="Enter the review text here..."></textarea>
            <button onclick="analyzeText()">Analyze Text</button>
        </div>
        <div id="result" class="result-section"></div>
        <div class="logout-button">
            <button onclick="logout()">Logout</button>
        </div>
    </div>

    <script>
        async function logout() {
            try {
                const response = await fetch('/logout', { method: 'POST' });
                const result = await response.json();
                if (response.ok) {
                    localStorage.removeItem("userId");
                    window.location.href = "/"; // Redirect back to login page
                } else {
                    alert('Logout failed.');
                }
            } catch (error) {
                alert('An error occurred during logout.');
            }
        }

        async function analyzeText() {
            const reviewText = document.getElementById('reviewText').value;
            const resultDiv = document.getElementById('result');

            if (!reviewText.trim()) {
                alert('Please enter text to analyze.');
                return;
            }

            try {
                // REORGANIZED: Point to the Python AI Engine on port 5001
                const response = await fetch('http://localhost:5001/analyze', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ reviewText })
                });

                const result = await response.json();
                if (response.ok) {
                    // Update UI with BERT analysis results
                    resultDiv.innerHTML = `<strong>Result:</strong> ${result.label} <br> <strong>Score:</strong> ${result.score.toFixed(2)}`;
                    resultDiv.className = `result-section ${result.label === 'Fake Review' ? 'fake' : 'genuine'}`;
                    resultDiv.style.display = "block";

                    // OPTIONAL: Save the review to MongoDB via the Node.js backend on port 5000
                    const userId = localStorage.getItem("userId");
                    if (userId) {
                        await fetch('/api/reviews', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ userId, reviewText })
                        });
                    }
                } else {
                    alert(result.error || "Analysis failed.");
                }
            } catch (error) {
                alert('An error occurred. Make sure your Python AI engine is running on port 5001.');
            }
        }
    </script>
</body>
</html>
